  <rect x="6.5" y="6.5" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="8" y1="9.5" x2="11" y2="9.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
</svg>
